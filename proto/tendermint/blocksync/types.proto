syntax = "proto3";
package tendermint.blocksync;

option go_package = "github.com/dashpay/tenderdash/proto/tendermint/blocksync";

import "gogoproto/gogo.proto";
import "tendermint/crypto/proof.proto";
import "tendermint/types/types.proto";

// BlockRequest requests a block for a specific height
message BlockRequest {
  int64 height = 1;
}

// NoBlockResponse informs the node that the peer does not have block at the
// requested height
message NoBlockResponse {
  int64 height = 1;
}

// BlockResponse returns block to the requested
message BlockResponse {
  // block is a serialized tendermint.types.Block: the bytes of the parts it
  // was committed with, in order. The commit's part set header is computed
  // over those bytes, and decoding and re-encoding the block can change them
  // (unknown fields, non-canonical encoding). On the wire this is the same as
  // an embedded tendermint.types.Block, the type of this field in older
  // releases.
  bytes                   block  = 1;
  tendermint.types.Commit commit = 2;
  // part_sizes is the size of each part the block was committed with, in
  // order. It is empty when the block was cut into parts of 64kB, the last
  // one shorter, the way honest proposers cut it.
  repeated uint32 part_sizes = 3;
  // part_proofs is the Merkle proof of each part the block was committed with,
  // in order, alongside part_sizes. It is empty when the part set header can
  // be computed from the parts, which it cannot when a proof's total differs
  // from the header's.
  repeated tendermint.crypto.Proof part_proofs = 4 [(gogoproto.nullable) = false];
}

// StatusRequest requests the status of a peer.
message StatusRequest {}

// StatusResponse is a peer response to inform their status.
message StatusResponse {
  int64 height = 1;
  int64 base   = 2;
}
