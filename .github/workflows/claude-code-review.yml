---
name: "Claude review (label: claudius-review, or reviewer: Claudius-Maginificent)"

"on":
  pull_request:
    types: [labeled, review_requested, ready_for_review, synchronize]

concurrency:
  # One review per PR: a new event supersedes the in-flight run. A cancelled
  # run skips label removal, so the label stays for the newest run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Gate: wait for the "Test" workflow (tests.yml) on the PR head commit and
  # only let the review run when it concluded successfully. Red/cancelled
  # tests skip the review (no extra failing check); a timeout fails the gate.
  wait-for-tests:
    # Draft status is intentionally ignored: the label / reviewer request is
    # the opt-in.
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'claudius-review') ||
      (github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'Claudius-Maginificent') ||
      (contains(fromJSON('["synchronize", "ready_for_review"]'), github.event.action) && (
        contains(github.event.pull_request.labels.*.name, 'claudius-review') ||
        contains(github.event.pull_request.requested_reviewers.*.login, 'Claudius-Maginificent')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      - name: Wait for tests.yml to finish on PR head
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          start=$SECONDS
          deadline=$((start + 110 * 60))
          # tests.yml triggers on every pull_request, so a run must show up
          # quickly; fail fast if it never does (renamed workflow, trigger drift).
          appear_deadline=$((start + 15 * 60))
          while :; do
            # Tolerate transient API errors; the poll loop retries.
            if ! run=$(gh run list -R "$REPO" --workflow tests.yml \
              --commit "$SHA" --branch "$HEAD_REF" --event pull_request \
              --limit 1 --json databaseId,status,conclusion \
              --jq '.[0] // empty'); then
              echo "::warning::gh run list failed; retrying"
              run=""
            fi
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              echo "tests.yml run $(jq -r .databaseId <<<"$run"): $conclusion"
              if [ "$conclusion" = success ]; then
                echo "green=true" >>"$GITHUB_OUTPUT"
              else
                msg="tests.yml concluded '$conclusion' for $SHA; Claudius review skipped"
                echo "::warning::$msg"
                echo "⚠️ $msg" >>"$GITHUB_STEP_SUMMARY"
                echo "green=false" >>"$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if [ -z "$run" ] && [ "$SECONDS" -ge "$appear_deadline" ]; then
              echo "::error::No tests.yml run found for $SHA after 15 min"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for tests.yml on $SHA"
              exit 1
            fi
            sleep 30
          done

  review:
    needs: wait-for-tests
    if: needs.wait-for-tests.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
      CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
    steps:
      - name: Claudius Review
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK != '' }}
        uses: lklimek/claudius-review-action@main
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
          memcan_url: ${{ vars.MEMCAN_URL }}
          memcan_api_key: ${{ secrets.MEMCAN_API_KEY }}
          claude_extra_args: "--permission-mode auto"
          # Clears Claudius-Maginificent's own pending review request on
          # success — the review itself posts under a different identity, so
          # GitHub never auto-clears it, and without this every push would
          # re-trigger a full review forever. No-op for the label trigger.
          reviewer_login: Claudius-Maginificent
          # Claudius-Maginificent only has triage access to this repo (no git
          # push), so the collaborator-permission API reports it as "read" —
          # below claude-code-action's admin/write bar. It's a trusted bot
          # that only ever applies the trigger label or requests itself as
          # reviewer, so allow-list it by name instead of granting real
          # write access.
          allowed_non_write_users: Claudius-Maginificent
