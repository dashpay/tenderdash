---
name: "Claude review (label: claudius-review, or reviewer: Claudius-Maginificent)"

"on":
  pull_request:
    types: [labeled, review_requested, ready_for_review, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event.pull_request.draft == false &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'claudius-review') ||
        (github.event.action == 'review_requested' && github.event.requested_reviewer.login == 'Claudius-Maginificent') ||
        (contains(fromJSON('["synchronize", "ready_for_review"]'), github.event.action) && (
          contains(github.event.pull_request.labels.*.name, 'claudius-review') ||
          contains(github.event.pull_request.requested_reviewers.*.login, 'Claudius-Maginificent')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    env:
      ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL || 'opus' }}
      CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
    steps:
      - name: Claudius Review
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK != '' }}
        uses: lklimek/claudius-review-action@main
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN_LKLIMEK }}
          memcan_url: ${{ vars.MEMCAN_URL }}
          memcan_api_key: ${{ secrets.MEMCAN_API_KEY }}
          claude_extra_args: "--permission-mode auto"
          # Clears Claudius-Maginificent's own pending review request on
          # success — the review itself posts under a different identity, so
          # GitHub never auto-clears it, and without this every push would
          # re-trigger a full review forever. No-op for the label trigger.
          reviewer_login: Claudius-Maginificent
          # Claudius-Maginificent only has triage access to this repo (no git
          # push), so the collaborator-permission API reports it as "read" —
          # below claude-code-action's admin/write bar. It's a trusted bot
          # that only ever applies the trigger label or requests itself as
          # reviewer, so allow-list it by name instead of granting real
          # write access.
          allowed_non_write_users: Claudius-Maginificent
