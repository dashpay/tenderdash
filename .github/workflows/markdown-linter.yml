name: Markdown Linter
on:
  pull_request:
    paths:
      - "**.md"
      - "**.yml"
      - "**.yaml"
  push:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

permissions:
  contents: read

jobs:
  build:
    name: Super linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Lint Code Base
        # v8.7.0 (github/super-linter was an abandoned fork, 791 commits behind
        # upstream, frozen at v7 since 2024-08-29; its v7 coordinates are affected
        # by CVE-2026-25761 (command injection via crafted filenames) with no fix
        # ever backported). Pinned by commit SHA per supply-chain policy.
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_MD: true
          VALIDATE_OPENAPI: true
          VALIDATE_YAML: true
          YAML_CONFIG_FILE: yaml-lint.yml
