---
name: Vulnerability Scan
# Runs govulncheck to detect known vulnerabilities in Go dependencies.
# The scan is GATING: the job fails if any vulnerability is found.
on:
  pull_request:
  push:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Runs after checkout so the Go cache key files exist; listing this
      # workflow file keeps its cache separate from other workflows.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
          cache-dependency-path: |
            go.sum
            .github/workflows/govulncheck.yml

      - name: Install BLS library
        uses: ./.github/actions/bls

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev

      - name: Run govulncheck
        run: make vulncheck
