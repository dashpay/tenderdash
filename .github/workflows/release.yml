name: Release tooling

on:
  pull_request:
    paths:
      - '.agents/skills/tenderdash-release/**'
      - 'scripts/release/**'
      - 'scripts/test-local-gates.sh'
      - 'Makefile'
      - '.github/workflows/release.yml'
  push:
    branches:
      - master
      - dev
      # Keep both names until the integration-branch migration is complete.
      - v1.8-dev
      - v1.9-dev
    paths:
      - '.agents/skills/tenderdash-release/**'
      - 'scripts/release/**'
      - 'scripts/test-local-gates.sh'
      - 'Makefile'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check local release planning and artifact invariants
        run: python3 -B -m unittest discover -s scripts/release -p test_release.py
      - name: Check lint base selection
        run: sh scripts/test-local-gates.sh
      - name: Check shell syntax
        run: bash -n scripts/release/build-artifacts.sh
