name: Release tooling

on:
  pull_request:
    paths:
      - '.agents/skills/tenderdash-release/**'
      - 'scripts/release/**'
      - 'scripts/docker-metadata.py'
      - 'scripts/tests/test_docker_metadata.py'
      - '.github/workflows/docker.yml'
      - 'DOCKER/Dockerfile'
      - 'DOCKER/docker-entrypoint.sh'
      - 'DOCKER/test-entrypoint.sh'
      - 'scripts/test-local-gates.sh'
      - 'Makefile'
      - '.github/workflows/release.yml'
  push:
    branches:
      - master
      - dev
    paths:
      - '.agents/skills/tenderdash-release/**'
      - 'scripts/release/**'
      - 'scripts/docker-metadata.py'
      - 'scripts/tests/test_docker_metadata.py'
      - '.github/workflows/docker.yml'
      - 'DOCKER/Dockerfile'
      - 'DOCKER/docker-entrypoint.sh'
      - 'DOCKER/test-entrypoint.sh'
      - 'scripts/test-local-gates.sh'
      - 'Makefile'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check local release planning and artifact invariants
        run: python3 -B -m unittest discover -s scripts/release -p test_release.py
      - name: Check Docker publication contract
        run: python3 -B -m unittest discover -s scripts/tests -p test_docker_metadata.py
      - name: Check Docker entrypoint signal handling
        run: bash DOCKER/test-entrypoint.sh
      - name: Check lint base selection
        run: sh scripts/test-local-gates.sh
      - name: Check shell syntax
        run: bash -n scripts/release/build-artifacts.sh
