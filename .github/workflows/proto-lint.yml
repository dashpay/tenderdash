name: Protobuf Lint
on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
      - "go.mod"
      - ".github/workflows/proto-lint.yml"
  push:
    branches:
      - master
      - v[0-9]+.[0-9]+-dev

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Keep CI on the same buf version as `make proto-*` (pinned in go.mod).
      - name: Read buf version from go.mod
        id: buf
        run: |
          set -euo pipefail
          version="$(awk '$1 == "github.com/bufbuild/buf" { sub(/^v/, "", $2); print $2 }' go.mod)"
          if [ -z "${version}" ]; then
            echo "::error::github.com/bufbuild/buf not found in go.mod"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: ${{ steps.buf.outputs.version }}
          github_token: ${{ github.token }}
          input: "proto"
          lint: true
          format: false
          breaking: false
          push: false
          archive: false
          pr_comment: false
