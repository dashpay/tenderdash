name: Protobuf Lint
on:
  pull_request:
    paths:
      - "proto/**"
  push:
    branches:
      - master
      - dev
      # Keep both names until the integration-branch migration is complete.
      - v1.8-dev
      - v1.9-dev

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: "proto"
