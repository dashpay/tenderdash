---
name: Check Markdown links

on:
  # Temporarily disabled job on PRs. Re-enable when docs are fixed.
  # pull_request:
  #   paths:
  #     - "**.md"
  push:
    branches:
      - master
      - dev

# Branch creation/rename events can refer to the deleted old branch.
env:
  GIT_DIFF: ${{ github.event_name == 'push' && github.event.created && 'all' || '' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: technote-space/get-diff-action@v6
        if: github.event_name != 'push' || !github.event.created
        with:
          # book/ links are relative to the staged mdBook tree; the docs
          # build checks them.
          PATTERNS: |
            **/**.md
            !book/**
          FORMAT: json
      - name: Check links in changed Markdown files
        if: env.GIT_DIFF
        run: |
          if [ "$GIT_DIFF" = all ]; then
            mapfile -t files < <(git ls-files '*.md' ':!:book/**')
          else
            mapfile -t files < <(jq -r '.[]' <<<"$GIT_DIFF")
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Markdown files."
            exit 0
          fi
          npx --yes markdown-link-check@3.14.2 --config .md-link-check.json --quiet "${files[@]}"
