---
name: Check Markdown links

on:
  # Temporarily disabled job on PRs. Re-enable when docs are fixed.
  # pull_request:
  #   paths:
  #     - "**.md"
  push:
    branches:
      - master
      - dev

# Branch creation/rename events can refer to the deleted old branch.
env:
  GIT_DIFF: ${{ github.event_name == 'push' && github.event.created && 'all' || '' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: technote-space/get-diff-action@v6
        if: github.event_name != 'push' || !github.event.created
        with:
          PATTERNS: |
            **/**.md
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          check-modified-files-only: "yes"
          config-file: ".md-link-check.json"
        if: env.GIT_DIFF
