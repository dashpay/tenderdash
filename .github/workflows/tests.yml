---
name: Test
on:
  pull_request:
  push:
    branches:
      - master
      - dev

# Branch creation/rename events can refer to the deleted old branch.
env:
  GIT_DIFF: ${{ github.event_name == 'push' && github.event.created && 'all' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        part: ["00", "01", "02", "03", "04", "05"]
    steps:
      - uses: actions/checkout@v7

      - uses: technote-space/get-diff-action@v6
        if: github.event_name != 'push' || !github.event.created
        with:
          PATTERNS: |
            .github/workflows/tests.yml
            .github/actions/bls/**
            third_party/bls-signatures/**
            **/**.go
            "!test/"
          FILES: |
            go.mod
            go.sum
            Makefile

      - uses: actions/setup-go@v7.0.0
        if: env.GIT_DIFF
        with:
          go-version: "1.27.4"

      - name: Install libpcap
        if: env.GIT_DIFF
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev

      - uses: ./.github/actions/bls
        name: Install BLS library
        if: env.GIT_DIFF

      - name: Run Go Tests
        if: env.GIT_DIFF
        env:
          CGO_LDFLAGS: "-L/usr/local/lib -ldashbls -lrelic_s -lmimalloc-secure -lgmp"
          CGO_CXXFLAGS: "-I/usr/local/include"
        run: |
          make test-group-${{ matrix.part }} NUM_SPLIT=6
