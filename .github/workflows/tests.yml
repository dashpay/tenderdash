---
name: Test
on:
  pull_request:
  push:
    branches:
      - master
      - dev

# Branch creation/rename events can refer to the deleted old branch.
env:
  GIT_DIFF: ${{ github.event_name == 'push' && github.event.created && 'all' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Picks the test part that runs on the self-hosted runner, or 'none'.
  # No checkout, no PR code. The inventory token is an environment secret, so
  # only jobs that declare this environment receive it. Without the token (fork
  # PRs) or on any API error the action falls back and every part stays hosted.
  # The environment must have no reviewers, wait timer, custom protection rules
  # or branch policy that excludes refs/pull/*/merge; those stall or fail it.
  lklimek-select-runner:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    environment:
      name: lklimek-runner-inventory
      deployment: false
    outputs:
      primary-part: >-
        ${{ steps.choose.outcome == 'success'
        && contains(fromJSON(steps.choose.outputs.use-runner || '[]'), 'lklimek-tenderdash')
        && '03' || 'none' }}
    steps:
      - name: Check self-hosted runner availability
        id: choose
        continue-on-error: true
        uses: lklimek/runner-fallback-action@07b67c1deaf3d980853669c82ae50a2fac345e1a
        with:
          github-token: ${{ secrets.LKLIMEK_RUNNER_INVENTORY_TOKEN }}
          primary-runner: lklimek-tenderdash
          fallback-runner: ubuntu-26.04
          primaries-required: "1"
          fallback-on-error: true

  tests:
    needs: lklimek-select-runner
    # Run even if the selector failed: every part then uses the hosted runner.
    if: ${{ !cancelled() }}
    runs-on: >-
      ${{ matrix.part == needs.lklimek-select-runner.outputs.primary-part
      && 'lklimek-tenderdash' || 'ubuntu-26.04' }}
    # Self-hosted part only: the host resolves the profile to its local image
    # and fixes the job limits. An empty string means no container.
    container: >-
      ${{ matrix.part == needs.lklimek-select-runner.outputs.primary-part
      && 'lklimek-tenderdash' || '' }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        part: ["00", "01", "02", "03", "04", "05"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: technote-space/get-diff-action@v6
        if: github.event_name != 'push' || !github.event.created
        with:
          PATTERNS: |
            .github/workflows/tests.yml
            .github/actions/bls/**
            third_party/bls-signatures/**
            **/**.go
            "!test/"
          FILES: |
            go.mod
            go.sum
            Makefile

      # Without a git checkout get-diff-action reports no changes and the tests
      # are skipped. It also leaves a remote whose URL embeds the job token.
      - name: Check checkout and remove get-diff-action remote
        if: ${{ !cancelled() }}
        run: |
          git rev-parse --git-dir > /dev/null
          # Exit status 2 means the remote does not exist.
          git remote remove get-diff-action || [[ $? == 2 ]]

      - uses: actions/setup-go@v7.1.0
        if: env.GIT_DIFF
        with:
          go-version: "1.27.4"

      - name: Install libpcap
        if: env.GIT_DIFF
        run: sudo apt-get update && sudo apt-get install --yes libpcap-dev

      - uses: ./.github/actions/bls
        name: Install BLS library
        if: env.GIT_DIFF

      - name: Run Go Tests
        if: env.GIT_DIFF
        env:
          CGO_LDFLAGS: "-L/usr/local/lib -ldashbls -lrelic_s -lmimalloc-secure -lgmp"
          CGO_CXXFLAGS: "-I/usr/local/include"
        run: |
          make test-group-${{ matrix.part }} NUM_SPLIT=6
