queue_rules:
  - name: default
    conditions:
      - base=dev
      - label=S:automerge

pull_request_rules:
  - name: Automerge to dev
    conditions:
      - base=dev
      - label=S:automerge
    actions:
      queue:
        method: squash
        name: default
        commit_message_template: |
          {{ title }} (#{{ number }})

          {{ body }}
