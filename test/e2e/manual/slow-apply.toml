# Only the explicit runner slow-apply command consumes this scenario.
# State sync is absent: every full node must fetch blocks from genesis.
abci_protocol = "builtin"
log_level = "info"
max_block_size = 8192
max_evidence_size = 1024

[node.slowapply-full]
mode = "full"
privval_protocol = "dashcore"
start_at = 100
persistent_peers = ["slowapply-v1", "slowapply-s1", "slowapply-s2", "slowapply-s3"]

[node.slowapply-v1]
persistent_peers = []

[node.slowapply-s1]
mode = "full"
privval_protocol = "dashcore"
persistent_peers = ["slowapply-v1"]

[node.slowapply-s2]
mode = "full"
privval_protocol = "dashcore"
persistent_peers = ["slowapply-v1"]

[node.slowapply-s3]
mode = "full"
privval_protocol = "dashcore"
persistent_peers = ["slowapply-v1"]
